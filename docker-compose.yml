version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: milocal-db
    environment:
      POSTGRES_DB: milocal
      POSTGRES_USER: milocal
      POSTGRES_PASSWORD: milocal
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milocal -d milocal"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milocal-api
    environment:
      DATABASE_URL: postgres://milocal:milocal@postgres:5432/milocal?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: "8080"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: milocal-web
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
