server {
    listen 80;
    server_name matchinmobiliario.fcadev.cl;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/docs {
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>MiLocal API Docs</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"></head><body><div id="swagger-ui"></div><script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script><script>SwaggerUIBundle({url:"/openapi.yaml",dom_id:"#swagger-ui"})</script></body></html>';
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
